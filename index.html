<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Body Tracking with Face & Hand Details</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic@0.5.1635989137/holistic.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script type="importmap">
        {
            "imports": {
                "mediapipe": "https://cdn.jsdelivr.net/npm/@mediapipe/holistic@0.5.1635989137/holistic.js",
                "mediapipe-drawing": "https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js",
                "camera-utils": "https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js",
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>3D Body Tracking</h1>
        <div id="calibration-overlay" class="calibration-overlay">
            <div class="calibration-content">
                <h2>Calibration Required</h2>
                <p>Please stand facing the camera in a T-pose with your elbows bent 90 degrees upwards (hands near your face). Hold this pose during the countdown.</p>
                <div id="countdown">5</div>
                <button id="calibrate-button">Start Calibration</button>
                <p id="calibration-status" class="calibration-status"></p>
            </div>
        </div>
        <div id="main-content" class="hidden">
            <div id="scene-container"></div>
            <div class="webcam-container">
                <video id="webcam" autoplay playsinline></video>
                <canvas id="output-canvas"></canvas>
            </div>
            <div class="controls">
                <div class="toggle-group">
                    <label>
                        <input type="checkbox" id="show-body" checked>
                        Body Tracking
                    </label>
                    <label>
                        <input type="checkbox" id="show-face" checked>
                        Face Tracking
                    </label>
                    <label>
                        <input type="checkbox" id="show-hands" checked>
                        Hand Tracking
                    </label>
                </div>
                <div class="status" id="status">Loading models...</div>
                <button id="recalibrate-button" class="calibrate-btn">Recalibrate</button>
            </div>
        </div>
    </div>
    <script type="module" src="calibration.js"></script> 
    <script type="module" src="app.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
