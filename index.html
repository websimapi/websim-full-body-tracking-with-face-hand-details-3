<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Body Tracking with Face & Hand Details</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic@0.5.1635989137/holistic.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js"></script>
    <script type="importmap">
        {
            "imports": {
                "mediapipe": "https://cdn.jsdelivr.net/npm/@mediapipe/holistic@0.5.1635989137/holistic.js",
                "mediapipe-drawing": "https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js",
                "camera-utils": "https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js",
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>3D Body Tracking</h1>
        <div id="scene-container"></div>
        <div class="webcam-container">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="output-canvas"></canvas>
        </div>
        <div class="controls">
            <div class="toggle-group">
                <label>
                    <input type="checkbox" id="show-body" checked>
                    Body Tracking
                </label>
                <label>
                    <input type="checkbox" id="show-face" checked>
                    Face Tracking
                </label>
                <label>
                    <input type="checkbox" id="show-hands" checked>
                    Hand Tracking
                </label>
            </div>
            <div class="status" id="status">Loading models...</div>
        </div>
    </div>
    <script type="module" src="app.js"></script>

</html>
